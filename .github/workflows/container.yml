name: Container

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run test:licensing
      - run: npm run build:runtime
      - run: node --check dist/index.mjs && node --check dist/migrate.mjs
      - name: Verify required runtime modules
        run: |
          test -f src/itsmConfig.js
          test -f src/itsmLifecycle.js
          test -f src/serviceRequestOperations.js
      - name: Verify distributable image does not contain raw API source
        run: |
          docker build -t hi5central-control-server:ci .
          docker run --rm --entrypoint sh hi5central-control-server:ci -ec 'test ! -d /app/src; test -f /app/dist/index.mjs; test -f /app/dist/migrate.mjs'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hi5central-control-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max